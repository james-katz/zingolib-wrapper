[package]
name = "zingolib-native"
version = "0.1.0"
authors = ["James Katz", "ZL Viridian <zingo@zingolabs.com>"]
license = "ISC"
edition = "2021"

[lib]
crate-type = ["cdylib"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
node-bindgen = { version = "6.0" }
zingolib = { git = "https://github.com/zingolabs/zingolib", default-features = true, tag = "2.0.7", features = [ "testutils" ] }
pepper-sync = { git = "https://github.com/zingolabs/zingolib", tag = "2.0.7" }
regchest_utils = { git = "https://github.com/zingolabs/zingo-regchest", branch = "dev" }
bip0039 = { version = "0.12", features = [ "rand" ] }
http = "1.1.0" 
lazy_static = "1.4.0"
tokio = { version = "1.24", features = ["full"] }
rustls = { version = "0.23.13", features = ["ring"] }

tracing = "0.1"
serde_json = "1"
json = "0.12"
futures = "0.3"
time-core = "=0.1.2"

zcash_primitives = { git = "https://github.com/zcash/librustzcash", rev = "d387aed7e04e881dbe30c6ff8b26a96c834c094b" }
zcash_keys = { git = "https://github.com/zcash/librustzcash", rev = "d387aed7e04e881dbe30c6ff8b26a96c834c094b", features = [
    "transparent-inputs",
    "sapling",
    "orchard",
] }
zcash_address = { git = "https://github.com/zcash/librustzcash", rev = "d387aed7e04e881dbe30c6ff8b26a96c834c094b" }
zcash_protocol = { git = "https://github.com/zcash/librustzcash", rev = "d387aed7e04e881dbe30c6ff8b26a96c834c094b", features = [
    "local-consensus",
] }
zcash_client_backend = { git = "https://github.com/zcash/librustzcash", rev = "d387aed7e04e881dbe30c6ff8b26a96c834c094b", features = [
    "lightwalletd-tonic",
    "orchard",
    "transparent-inputs",
    "tor",
] }

[build-dependencies]
node-bindgen = { version = "6.0", default-features = false, features = ["build"] }